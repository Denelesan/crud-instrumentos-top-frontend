<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <style>
      .stroke-primary {
        stroke: #1B365D;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .stroke-thin {
        stroke: #1B365D;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .fill-primary {
        fill: #1B365D;
      }
      .bg-card {
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Flecha Vertical Central (Dirección / Progreso) -->
  <path class="stroke-primary" d="M 250, 190 V 60" />
  <polygon class="fill-primary" points="250,40 235,70 265,70" />

  <!-- Visor Topográfico Principal (Lente) -->
  <circle cx="250" cy="190" r="60" class="stroke-primary" />
  <circle cx="250" cy="190" r="45" class="stroke-thin" />
  <circle cx="250" cy="190" r="25" class="fill-primary" />
  
  <!-- Puntos Cardinales / Enfoque del Lente -->
  <circle cx="250" cy="125" r="6" class="fill-primary" />
  <circle cx="250" cy="255" r="6" class="fill-primary" />
  <circle cx="185" cy="190" r="6" class="fill-primary" />
  <circle cx="315" cy="190" r="6" class="fill-primary" />

  <!-- Base de la Estación Total -->
  <path class="stroke-primary" d="M 210, 260 H 290 L 300, 290 H 200 Z" />
  <rect x="215" y="290" width="70" height="15" class="stroke-thin" rx="3" />

  <!-- Trípode Topográfico -->
  <!-- Pata Izquierda -->
  <path class="stroke-primary" d="M 210, 305 L 140, 520" />
  <path class="stroke-thin" d="M 225, 305 L 165, 520" />
  <!-- Pata Central -->
  <path class="stroke-primary" d="M 250, 305 V 530" />
  <!-- Pata Derecha -->
  <path class="stroke-primary" d="M 290, 305 L 360, 520" />
  <path class="stroke-thin" d="M 275, 305 L 335, 520" />

  <!-- Soportes / Estabilizadores del Trípode -->
  <path class="stroke-thin" d="M 190, 370 H 310" />

  <!-- Trazabilidad / Verificación (Línea de Curva y Checkbox) -->
  <path class="stroke-primary" d="M 120, 430 Q 180, 480 230, 430 T 360, 360" />
  <circle cx="360" cy="360" r="7" class="fill-primary" />
  <circle cx="120" cy="430" r="7" class="fill-primary" />

  <!-- Ícono de Verificación (Check mark) en el Centro -->
  <g transform="translate(225, 410)">
    <rect x="0" y="0" width="50" height="50" rx="8" class="bg-card" />
    <rect x="0" y="0" width="50" height="50" rx="8" class="stroke-thin" />
    <path class="stroke-primary" d="M 12, 25 L 22, 35 L 38, 15" />
  </g>
</svg>